[project]
name = "whatsapp-langchain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.2.8",
    "langgraph==1.0.7",
    "langchain-openai==1.1.7",
    "langgraph-checkpoint-postgres==3.0.4",
    "python-dotenv==1.2.1",
    "fastapi==0.129.0",
    "uvicorn[standard]==0.40.0",
    "psycopg[binary,pool]==3.3.2",
    "pydantic-settings==2.12.0",
    "structlog==25.5.0",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "twilio==9.10.2",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]==0.4.12",
    "ruff==0.9.6",
    "pyright==1.1.408",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    "langgraph-sdk==0.3.12",
]
# Ruff verifica sintaxe, imports, estilo e consistencia do codigo.
[tool.ruff]
line-length = 88  # tamanho maximo de uma linha python, ou seja, uma linha muito longa vira duas
target-version = "py311" # versao do python que ele irá olhar, aqui o 3.11

[tool.ruff.format]
quote-style = "double"  # usa aspas duplas em vez de aspas simples

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # E = erros de estilo, F = erros de sintaxe, I = importaçoes desnecessarias, UP = uso de importações não padronizadas

# Pyright analisa tipos e contratos entre funcoes.
[tool.pyright]
pythonVersion = "3.11" # versão do python que ele irá olhar, aqui o 3.11
typeCheckingMode = "standard" # "off" = desliga, "basic" = só tipos padrões, "standard" = tipos padrões + tipos externos, "strictest" = tipos padrões + tipos externos + obrigatório declarar tipos em todas as funções.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker_demo: testes demonstrativos que exigem API/Worker/DB rodando em Docker",
]
